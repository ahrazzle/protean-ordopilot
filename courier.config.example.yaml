#   provider: custom
#   model: local-tag
# cheap:
#   provider: openrouter
#   model: cheap-tier-model
# free:
#   provider: openrouter
#   model: blockrun/free
free_tier_allowed: false
timeout_s: 8.0
confidence_floor: 0.65
