[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "courier"
version = "0.1.0"
description = "Courier session-router core (v0.1 CLI-core MVP)"
requires-python = ">=3.9"

[project.scripts]
courier = "courier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
